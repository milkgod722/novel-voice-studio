<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小说声工坊</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><span class="eyebrow">LOCAL · PRIVATE · EXPRESSIVE</span><h1>让你的声音，<br><i>住进一本书。</i></h1><p>导入一段日常语音与小说，自动逐句判断情绪，生成自然、有起伏的个人有声书。</p><div id="engine" class="engine">正在连接引擎…</div></header>
    <section class="steps">
      <article><b>01</b><h2>留下声音</h2><p>建议上传 10–30 秒安静环境中的微信语音。正常聊天即可，不必刻意播音。</p><form id="voice-form"><label>声音名称<input name="name" value="我的声音"></label><label class="drop">选择语音文件<input name="file" type="file" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm" required></label><label class="consent"><input name="consent" type="checkbox" required> 我确认已获得声音本人的明确授权，仅用于合法用途</label><button>保存声音</button></form></article>
      <article><b>02</b><h2>放入小说</h2><p>支持 TXT、Markdown、EPUB，自动识别中文编码与章节。</p><form id="book-form"><label>书名（可选）<input name="title" placeholder="留空则使用文件名"></label><label class="drop">选择小说文件<input name="file" type="file" accept=".txt,.md,.epub" required></label><button>导入小说</button></form></article>
      <article><b>03</b><h2>开始演绎</h2><p>为叙述保持克制，为对白增加情绪；强度 0.55–0.75 通常最自然。</p><form id="job-form"><label>声音<select name="voice_id" required></select></label><label>小说<select name="book_id" required></select></label><div class="range"><label>起始章<input name="chapter_start" type="number" min="1" value="1"></label><label>结束章<input name="chapter_end" type="number" min="1" placeholder="末章"></label></div><label>情感强度 <output id="strength-value">65%</output><input name="emotion_strength" type="range" min="0" max="1" step="0.05" value="0.65"></label><button>生成有声书</button></form></article>
    </section>
    <section class="jobs"><div><span class="eyebrow">RENDER QUEUE</span><h2>作品台</h2></div><div id="jobs"><p class="empty">还没有作品。完成上面三步，它会出现在这里。</p></div></section>
  </main><div id="toast"></div><script src="/app.js"></script>
</body></html>
